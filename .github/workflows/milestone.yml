name: PR Milestone

on:
  pull_request_target:
    types: [ closed ]

jobs:
  milestone:
    if: ${{ github.event.pull_request.merged && github.event.pull_request.milestone != null }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
    - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      with:
        script: |
          // graphql query to get referenced issues to merged pull request
          const query = `query($_url:URI!) {
            resource(url:$_url) {
              ... on PullRequest {
                closingIssuesReferences(first:10) {
                  nodes {
                    number
                    repository { nameWithOwner }
                  }
                }              
              }
            }
          }`;

          const pullRequest = context.payload.pull_request;
          const result = await github.graphql(query, { _url: pullRequest.html_url });
          const repository = `${context.repo.owner}/${context.repo.repo}`;
          const refIssues = result.resource.closingIssuesReferences.nodes.filter(
            issue => issue.repository.nameWithOwner === repository,
          );

          for (const issue of refIssues) {
            console.log("Adding milestone to linked issue: ", issue.number);

            // if issues have milestone, then it will be removed and updated with following
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              milestone: pullRequest.milestone.number
            });
          }

