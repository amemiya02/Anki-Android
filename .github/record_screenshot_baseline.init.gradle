import org.gradle.api.tasks.testing.Test

// Applied only in the detached baseline worktree. Historical assertions still run and are
// reported, and screenshots captured before an assertion failed remain available to compare.
gradle.allprojects {
    tasks.withType(Test).configureEach {
        ignoreFailures = true
    }
}
