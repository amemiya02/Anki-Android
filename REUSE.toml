version = 1

# make FileCopyrightText optional on all .kt files
# see docs/contributing/copyright-headers.md
[[annotations]]
path = "**.kt"
precedence = "aggregate"
SPDX-FileCopyrightText = "Contributors to the AnkiDroid project"

# The interface typefaces, bundled unmodified; each face's licence is also in
# common/android/src/main/assets/fonts/<face>/OFL.txt, which ships in the app
[[annotations]]
path = ["common/android/src/main/res/font/newsreader.ttf", "common/android/src/main/assets/fonts/newsreader/OFL.txt"]
SPDX-FileCopyrightText = "2020 The Newsreader Project Authors (https://github.com/productiontype/Newsreader)"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = ["common/android/src/main/res/font/lxgw_wenkai_*.ttf", "common/android/src/main/assets/fonts/lxgw-wenkai/OFL.txt"]
SPDX-FileCopyrightText = ["2021-2026 LXGW (https://github.com/lxgw/LxgwWenKai)", "2020 The Klee Project Authors (https://github.com/fontworks-fonts/Klee)"]
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = ["common/android/src/main/res/font/klee_one_*.ttf", "common/android/src/main/assets/fonts/klee-one/OFL.txt"]
SPDX-FileCopyrightText = "2020 The Klee Project Authors (https://github.com/fontworks-fonts/Klee)"
SPDX-License-Identifier = "OFL-1.1"
