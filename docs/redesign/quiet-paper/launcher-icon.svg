<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" role="img" aria-label="Hayaki launcher icon: two paper cards on cinnabar">
  <!--
    The Hayaki launcher icon, on Android's 108dp adaptive icon canvas.
    The background layer is the cinnabar ground. The foreground layer is the
    group with id="foreground"; it stays inside the central 66dp safe zone so
    no launcher mask clips it.
  -->
  <rect id="background" width="108" height="108" fill="#A63D25"/>
  <g id="foreground">
    <rect x="38" y="30" width="36" height="48" rx="4" fill="none" stroke="#FFF9F2" stroke-width="2.5" transform="rotate(9 56 54)"/>
    <g transform="rotate(-7 52 54)">
      <rect x="34" y="30" width="36" height="48" rx="4" fill="#FFF9F2"/>
      <rect x="41" y="40" width="22" height="2.5" rx="1.25" fill="#211E19"/>
      <rect x="41" y="47" width="14" height="2.5" rx="1.25" fill="#211E19"/>
      <circle cx="60" cy="68" r="3.2" fill="#A63D25"/>
    </g>
  </g>
</svg>
